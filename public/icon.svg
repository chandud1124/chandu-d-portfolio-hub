<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" fill="#0F172A" rx="64"/>
  
  <!-- Gradient Definition - Teal to Sky Blue -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Letter "C" and "D" with modern design -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="180" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="url(#grad)">CD</text>
  
  <!-- Decorative code bracket -->
  <path d="M 140 380 L 120 380 L 120 130 L 140 130" stroke="#38BDF8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 372 380 L 392 380 L 392 130 L 372 130" stroke="#38BDF8" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
