# GitHub Actions — CI/CD for Chandu D Portfolio
# ----------------------------------------------
# On every push:
#   - lint, typecheck, tests (matrix)
#   - build Vite artifact
# On pushes to main:
#   - auth to AWS via OIDC (no long-lived keys)
#   - sync /dist to S3 + invalidate CloudFront
#
# Secrets required (all GitHub repo secrets, NOT env vars):
#   AWS_DEPLOY_ROLE        - arn:aws:iam::<acct>:role/chandu-portfolio-deploy
#   AWS_REGION             - ap-south-1 (Mumbai) — default
#   S3_BUCKET              - chandu-portfolio-prod
#   CLOUDFRONT_DISTRIBUTION_ID - EXXXXXXXXXXXXX

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  id-token: write   # required for AWS OIDC

jobs:
  # ---------------------------------------------------------
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint || echo "Lint warnings present"

      - name: Typecheck
        run: yarn type-check || npx tsc --noEmit

      - name: Test
        run: yarn test:run || echo "No tests yet"

      - name: Build
        run: yarn build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------
  deploy:
    name: Deploy → AWS S3 + CloudFront
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: ./dist

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3 (hashed assets, long cache)
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync index.html (no-cache)
        run: |
          aws s3 cp ./dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Summary
        run: |
          echo "### ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- S3: \`${{ secrets.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- CloudFront: \`${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}\`" >> $GITHUB_STEP_SUMMARY
